<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Service Error | Krish Ujeniya</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #050505;
      color: #ECECEC;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }
    .card {
      max-width: 440px;
      width: 100%;
      background: #0D0D0D;
      border: 1px solid #222222;
      border-radius: 1rem;
      padding: 2.5rem;
      text-align: center;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
    }
    .badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 4rem;
      height: 4rem;
      border-radius: 9999px;
      background: #181818;
      border: 1px solid #2E2E2E;
      margin-bottom: 1.5rem;
      font-size: 1.5rem;
      font-weight: 900;
      color: #FFFFFF;
    }
    h1 {
      font-size: 1.5rem;
      font-weight: 700;
      color: #FFFFFF;
      margin-bottom: 0.75rem;
      letter-spacing: -0.025em;
    }
    p {
      font-size: 0.875rem;
      color: #999999;
      line-height: 1.6;
      margin-bottom: 1.5rem;
    }
    .btn {
      display: inline-block;
      width: 100%;
      padding: 0.75rem 1.5rem;
      border-radius: 0.75rem;
      background: #FFFFFF;
      color: #000000;
      font-weight: 600;
      font-size: 0.875rem;
      text-decoration: none;
      transition: background 0.15s ease;
      cursor: pointer;
      border: none;
    }
    .btn:hover { background: #E5E5E5; }
  </style>
</head>
<body>
  <div class="card">
    <div class="badge">500</div>
    <h1>System Recovery</h1>
    <p>A temporary server or network exception was encountered. Please try reconnecting or return to the main portfolio.</p>
    <a href="/" id="home-link" class="btn">Return to Portfolio</a>
  </div>
  <script>
    var link = document.getElementById('home-link');
    if (link && window.location.pathname.startsWith('/krishujeniya')) {
      link.setAttribute('href', '/krishujeniya/');
    }
  </script>
</body>
</html>
