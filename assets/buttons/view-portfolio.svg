<svg xmlns="http://www.w3.org/2000/svg" width="216" height="46" viewBox="0 0 216 46" role="img" aria-label="View Portfolio">
<title>View Portfolio</title>
<defs>
  <filter id="vp-glow" x="-10%" y="-20%" width="120%" height="150%">
    <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#ffffff" flood-opacity="0.12"/>
    <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.3"/>
  </filter>
</defs>
<style>
  .btn-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; font-size: 11px; font-weight: 800; letter-spacing: 0.18em; fill: #000000; text-anchor: middle; }
  .btn-icon { stroke: #000000; stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; transition: transform 0.2s ease; }
  rect { transition: all 0.2s ease; }
