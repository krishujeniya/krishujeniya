name: Verify Backend

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/verify-backend.yml"
  pull_request:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/verify-backend.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.3.0
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python via uv
        run: uv python install 3.12

      - name: Generate deterministic lockfile via uv
        run: uv lock

      - name: Install dependencies via uv
        run: uv sync --extra dev

      - name: Check dependency consistency via uv
        run: uv pip check

      - name: Validate backend configuration
        run: uv run python -c "import json; json.load(open('vercel.json', encoding='utf-8'))"

      - name: Lint via uv
        run: uv run ruff check api tests

      - name: Test with coverage via uv
        run: uv run pytest --cov=api.index --cov-report=term-missing --cov-fail-under=80
