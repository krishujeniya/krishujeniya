name: Deploy to Cloudflare Pages

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/deploy-cloudflare.yml"
      - "functions/**"
      - "public/**"
      - "src/**"
      - "package.json"
      - "package-lock.json"
      - "next.config.ts"
      - "wrangler.toml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "cloudflare-pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Verify document allowlist and integrity
        run: npm run verify:docs

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build Next.js static export
        env:
          BASE_PATH: ""
        run: npm run build

      - name: Ensure Cloudflare manifests are in build output
        run: |
          test -f out/_redirects || cp public/_redirects out/_redirects
          test -f out/_headers || cp public/_headers out/_headers

      - name: Check Cloudflare secrets
        id: check-secrets
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CF_API_TOKEN" ] && [ -n "$CF_ACCOUNT_ID" ]; then
            echo "has_secrets=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_secrets=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Cloudflare secrets (CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID) not configured in repo secrets. Skipping automated deployment."
          fi

      - name: Deploy to Cloudflare Pages via Wrangler
        if: steps.check-secrets.outputs.has_secrets == 'true'
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3.14.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy out --project-name=krishujeniya --branch=main

      - name: Verify Cloudflare Pages edge health
        if: steps.check-secrets.outputs.has_secrets == 'true'
        run: |
          for attempt in {1..6}; do
            echo "Attempt $attempt: Probing published Cloudflare Pages edge..."
            if curl -sI --fail https://krishujeniya.pages.dev/ | grep -Eq "200" && \
               curl -sI --fail https://krishujeniya.pages.dev/images/projects/amberclaw.webp | grep -Eq "200" && \
               curl -s --fail https://krishujeniya.pages.dev/api/health | grep -Eq "ready"; then
              echo "Cloudflare Pages production edge verified healthy at root apex with edge functions."
              exit 0
            fi
            sleep 5
          done
          echo "Edge health verification failed."
          exit 1
