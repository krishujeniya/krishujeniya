[project]
name = "krishujeniya-backend"
version = "0.1.0"
description = "FastAPI backend for Krish Ujeniya portfolio"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.162.7",
    "httpx==0.28.1",
    "pydantic[email]==2.14.3",
    "pymongo==4.20.0",
    "uvicorn==0.54.0",
]

[project.optional-dependencies]
dev = [
    "pip-audit==2.10.1",
    "pytest==9.2.0",
    "pytest-cov==7.1.0",
    "ruff==0.14.7",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
